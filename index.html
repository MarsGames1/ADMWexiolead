<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WexioLead — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #07080a;
    --surface: #0e1014;
    --border: rgba(255,255,255,0.06);
    --text: #f0f0f0;
    --muted: #d1d5db;
    --accent: #4fffb0;
    --accent2: #00d4ff;
    --white: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
    display: block;
  }

  .admin-card {
    position: relative;
    z-index: 1;
    background: rgba(14, 16, 20, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--white);
    text-align: center;
    margin-bottom: 28px;
    display: block;
  }
  .logo span { color: var(--accent); }

  .admin-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--white);
    margin-bottom: 6px;
  }

  .admin-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  .form-group input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: rgba(79,255,176,0.4); }
  .form-group input::placeholder { color: rgba(255,255,255,0.25); }

  .form-error {
    font-size: 12px;
    color: #ff4f4f;
    margin-top: 6px;
    display: none;
  }
  .form-error.visible { display: block; }

  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.01em;
  }
  .btn-login:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #0e1014;
    border: 1px solid rgba(79,255,176,0.3);
    border-radius: 10px;
    padding: 14px 20px;
    color: var(--text);
    font-size: 14px;
    z-index: 2000;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 260px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: rgba(255,79,79,0.3); }
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="toast" id="toast" role="alert" aria-live="polite">
  <span id="toastIcon">✓</span>
  <span id="toastMsg"></span>
</div>

<div class="admin-card">
  <span class="logo">Wexio<span>Lead</span></span>
  <div class="admin-title">Admin</div>
  <div class="admin-sub">Entre com sua conta de administrador</div>

  <div class="form-group">
    <label for="adminEmail">E-mail</label>
    <input type="email" id="adminEmail" autocomplete="email" placeholder="admin@wexiolead.com.br">
    <div class="form-error" id="errAdminEmail"></div>
  </div>

  <div class="form-group">
    <label for="adminPassword">Senha</label>
    <input type="password" id="adminPassword" autocomplete="current-password" placeholder="••••••••••••">
    <div class="form-error" id="errAdminPassword"></div>
  </div>

  <button class="btn-login" id="btnAdminLogin" onclick="adminLogin()">
    <span id="btnAdminText">Entrar</span>
  </button>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>

<script>
// ── SUPABASE CONFIG ──
const SUPABASE_URL = 'https://heootuhrqwqacuveycpa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UL9D7RQtH62T2j-abknE9A_qm7MZA5m';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── TOAST ──
let toastTimeout;
function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const toastIcon = document.getElementById('toastIcon');
  toastMsg.textContent = msg;
  toastIcon.textContent = isError ? '✕' : '✓';
  toast.classList.toggle('error', isError);
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ── VALIDATION HELPERS ──
function showError(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.classList.add('visible'); }
}

function clearErrors() {
  document.querySelectorAll('.form-error').forEach(el => {
    el.textContent = '';
    el.classList.remove('visible');
  });
}

// ── LOADING STATE ──
function setLoading(loading) {
  const btn = document.getElementById('btnAdminLogin');
  const textEl = document.getElementById('btnAdminText');
  btn.disabled = loading;
  if (loading) {
    textEl.innerHTML = '<div class="spinner"></div>';
  } else {
    textEl.textContent = 'Entrar';
  }
}

// ── ADMIN LOGIN ──
async function adminLogin() {
  clearErrors();
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;

  let valid = true;
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showError('errAdminEmail', 'E-mail inválido.');
    valid = false;
  }
  if (!password) {
    showError('errAdminPassword', 'Informe sua senha.');
    valid = false;
  }
  if (!valid) return;

  setLoading(true);
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    showToast('Login realizado com sucesso!');
    setTimeout(() => { window.location.href = 'https://marsgames1.github.io/ADMWexiolead/'; }, 1200);
  } catch (err) {
    console.error('Supabase error:', err);
    const msg = err.message || err.error_description || JSON.stringify(err) || 'Erro ao entrar.';
    if (
      msg.includes('Invalid login') ||
      msg.includes('invalid_credentials') ||
      msg.includes('Invalid email') ||
      msg.includes('Email not confirmed') ||
      msg.includes('Bad Request')
    ) {
      showError('errAdminPassword', 'E-mail ou senha incorretos. Verifique seus dados.');
    } else {
      showToast('Erro: ' + msg, true);
    }
  } finally {
    setLoading(false);
  }
}

// Enter key support
document.getElementById('adminPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') adminLogin();
});
document.getElementById('adminEmail').addEventListener('keydown', e => {
  if (e.key === 'Enter') adminLogin();
});

// ── CANVAS BACKGROUND ──
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, particles, rafId;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function createParticles() {
  particles = Array.from({length: 60}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.5 + 0.3,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.3,
    opacity: Math.random() * 0.4 + 0.05,
    color: Math.random() > 0.6 ? '#4fffb0' : Math.random() > 0.5 ? '#00d4ff' : '#ffffff'
  }));
}

function drawLines() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(79,255,176,${0.04 * (1 - dist/120)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  drawLines();
  particles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0 || p.x > W) p.dx *= -1;
    if (p.y < 0 || p.y > H) p.dy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.opacity;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  rafId = requestAnimationFrame(animate);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(rafId);
  } else {
    animate();
  }
});

// Initialize — createParticles() MUST be called before animate()
resize();
createParticles();
animate();
window.addEventListener('resize', () => { resize(); createParticles(); });
</script>
</body>
</html>
